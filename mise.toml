[tools]
node = "24.21.0"
pnpm = "12.4.2"
rust = "1.98.1"

[tasks."codegen:ts"]
description = "Generate TypeScript bindings"
dir = "src-tauri"
run = "cargo codegen ts"

[tasks."codegen:gql"]
description = "Generate GraphQL queries and TypeScript bindings"
dir = "src-tauri"
run = "cargo codegen gql"

[tasks."doc"]
description = "Start the documentation dev server"
dir = "docs"
run = "pnpm run dev"

[tasks."dev"]
description = "Start the app in dev mode"
run = "pnpm tauri dev"

[tasks."build"]
description = "Build the app"
run = "pnpm tauri build"

