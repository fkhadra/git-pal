query UserProfile {
  viewer {
    login
    avatarUrl
    email
    url
    organizations(first: 5) {
      nodes {
        login
        name
        avatarUrl
        url
      }
    }
  }
}

query Homepage($pullRequestCount: Int!, $topRepositoryCount: Int!) {
  viewer {
    pullRequests(
      states: OPEN
      first: $pullRequestCount
      orderBy: { direction: DESC, field: CREATED_AT }
    ) {
      nodes {
        __typename
        ...PullRequest
      }
    }
    topRepositories(
      first: $topRepositoryCount
      orderBy: { field: STARGAZERS, direction: DESC }
    ) {
      nodes {
        id
        name
        url
        isPrivate
        isInOrganization
        stargazerCount
        pullRequests(states: OPEN) {
          totalCount
        }
        issues(states: OPEN) {
          totalCount
        }
        owner {
          __typename
          login
          avatarUrl
        }
      }
    }
  }
}

query SearchPullRequest($count: Int!, $query: String!) {
  search(first: $count, query: $query, type: ISSUE) {
    nodes {
      __typename
      ...PullRequest
    }
  }
}
