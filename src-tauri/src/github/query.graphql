fragment PullRequest on PullRequest {
  id
  number
  title
  url
  isDraft
  isInMergeQueue
  mergeable
  state
  reviewDecision
  totalCommentsCount
  statusCheckRollup {
    state
    commit {
      status {
        state
        contexts {
          state
          context
          description
          targetUrl
        }
      }
    }
  }
  autoMergeRequest {
    enabledAt
  }
  author {
    __typename
    login
    url
    avatarUrl
  }
  repository {
    owner {
      __typename
      login
    }
    name
    url
  }
  baseRefName
  headRefName
  createdAt
  mergedAt
}

